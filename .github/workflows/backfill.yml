name: pla365-backfill-extras

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Backfill extras history from board archives
        env:
          TZ: Asia/Shanghai
        run: python generator/backfill_extras.py
      - name: Commit backfilled state
        run: |
          git config user.name "pla365-bot"
          git config user.email "actions@github.com"
          git add generator/state
          git diff --cached --quiet || git commit -m "data: backfill extras history from board archives"
          git push
