name: pla365-daily

on:
  schedule:
    - cron: "30 2 * * *"   # 10:30 Asia/Shanghai
    - cron: "35 9 * * *"   # 17:35 Asia/Shanghai (finalise late benchmarks + same-day board)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install playwright openpyxl pillow requests
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Scrape, build and deploy
        env:
          TZ: Asia/Shanghai
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e8ea3368456f6b065756c95282b14dca
        run: python generator/run_daily.py
      - name: Commit updated data
        run: |
          git config user.name "pla365-bot"
          git config user.email "actions@github.com"
          git add data daily generator/state
          git diff --cached --quiet || git commit -m "data: daily update $(TZ=Asia/Shanghai date +%F)"
          git push
      - name: Push URLs to Baidu (no-op until the secret is set)
        env:
          TZ: Asia/Shanghai
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: python generator/push_baidu.py
